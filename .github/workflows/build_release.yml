name: Build & Release StereoForge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: StereoForge-Windows-x64.zip
            platform: windows
          - os: macos-latest
            artifact_name: StereoForge-macOS-Universal.dmg
            platform: macos
          - os: ubuntu-latest
            artifact_name: StereoForge-Linux-x86_64.AppImage
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller pytest numpy opencv-python PySide6

      - name: Run Unit Tests
        run: |
          python tests/test_pure.py

      - name: Build Standalone Executable (Windows)
        if: matrix.platform == 'windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "StereoForge" `
            --add-data "STEREOFORGE_SPECIFICATION.md;." `
            --add-data "README.md;." `
            stereoforge/ui/app.py
          Compress-Archive -Path dist/StereoForge -DestinationPath ${{ matrix.artifact_name }}

      - name: Build App Bundle (macOS)
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --windowed --name "StereoForge" \
            --add-data "STEREOFORGE_SPECIFICATION.md:." \
            --add-data "README.md:." \
            stereoforge/ui/app.py
          hdiutil create -volname "StereoForge" -srcfolder dist/StereoForge.app -ov -format UDZO ${{ matrix.artifact_name }}

      - name: Build AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --noconfirm --onedir --name "StereoForge" \
            --add-data "STEREOFORGE_SPECIFICATION.md:." \
            --add-data "README.md:." \
            stereoforge/ui/app.py
          tar -czvf ${{ matrix.artifact_name }} -C dist/StereoForge .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
