name: StereoForge CI/CD & Automated Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg mkvtoolnix

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        run: |
          pytest tests/ -v

  build-and-release:
    name: Build Packages & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download tsMuxeR & Subwoofa Tools
        run: |
          python tools/download_tools.py

      - name: Package Windows Portable Distribution
        run: |
          python scripts/package_portable.py

      - name: Package macOS and Linux Distributions
        shell: bash
        run: |
          chmod +x scripts/package_macos.sh scripts/package_linux.sh
          ./scripts/package_macos.sh
          ./scripts/package_linux.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/StereoForge_Portable_Win64.zip
            dist/StereoForge_macOS.zip
            dist/StereoForge_Linux_x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
